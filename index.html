<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindCare App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>How are you feeling today?</h1>
        <p>Take a moment to check in with yourself.</p>
    </header>

    <main>

        <!-- MOOD SECTION -->
        <section class="mood-section">
            <h2>Choose your mood</h2>

            <button onclick="setMood('happy')">🙂 Happy</button>
            <button onclick="setMood('neutral')">😐 Okay</button>
            <button onclick="setMood('sad')">😔 Sad</button>
            <button onclick="setMood('stress')">😰 Stressed</button>
            <button onclick="setMood('tired')">😴 Tired</button>
        </section>

        <!-- NEED SECTION -->
         <section class="need-section">
            <h2>What do you need today?</h2>

            <button onclick="setNeed('calm')">🧘 Calm</button>
            <button onclick="setNeed('talk')">💬 Talk</button>
            <button onclick="setNeed('rest')">😴 Rest</button>
            <button onclick="setNeed('focus')">🎯 Focus</button>
            <button onclick="setNeed('distraction')">🎧 Distraction</button>
         </section>

         <!-- RESULT -->
          <section class="result-section">
            <h2>Your Result</h2>
            <p id="result-text">Select your mood and need to see your result.</p>
            
            <button onclick="showResult()">Show Result</button>
          </section>
    </main>

    <footer>
        <p>made with care by Ezgi</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
