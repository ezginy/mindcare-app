<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindCare App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>How are you feeling today?</h1>
        <p>Take a moment to check in with yourself.</p>
    </header>

    <main>
        <section class="mood-section">
            <h2>Choose your mood</h2>

            <button onclick="setMood('happy')">🙂 Happy</button>
            <button onclick="setMood('neutral')">😐 Okay</button>
            <button onclick="setMood('sad')">😔 Sad</button>
            <button onclick="setMood('stress')">😰 Stressed</button>
            <button onclick="setMood('tired')">😴 Tired</button>
        </section>
    </main>

    <footer>
        <p>made with care by Ezgi</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
