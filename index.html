<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindCare App</title>

    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="fade-in">
        <h1>How are you feeling today?</h1>
        <p>Take a moment to check in with yourself.</p>
    </header>

    <main>

        <!-- MOOD SECTION -->
        <section class="mood-section">
            <h2>Choose your mood</h2>

            <button onclick="setMood('happy', event)">🙂 Happy</button>
            <button onclick="setMood('neutral', event)">😐 Okay</button>
            <button onclick="setMood('sad', event)">😔 Sad</button>
            <button onclick="setMood('stress', event)">😰 Stressed</button>
            <button onclick="setMood('tired', event)">😴 Tired</button>
        </section>

        <!-- NEED SECTION -->
         <section class="need-section">
            <h2>What do you need today?</h2>

            <button onclick="setNeed('calm', event)">🧘 Calm</button>
            <button onclick="setNeed('talk', event)">💬 Talk</button>
            <button onclick="setNeed('rest', event)">😴 Rest</button>
            <button onclick="setNeed('focus', event)">🎯 Focus</button>
            <button onclick="setNeed('distraction', event)">🎧 Distraction</button>
         </section>

         <!-- RESULT SECTION -->
          <section class="result-section">
            <h2>Your Result</h2>
            <p id="result-text" class="fade-in">Select your mood and need to see your result.</p>

            <button onclick="showResult()">Show Result</button>
          </section>

          <!-- HISTORY SECTION -->
            <section class="history-section">
                <h2>Recent Check-ins</h2>

                <ul id="history-list"></ul>
            </section>
    </main>

    <footer>
        <p>made with care by Ezgi</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
