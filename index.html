<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindCare App</title>

    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Ambient animated mood background -->
     <div class="background-glow"></div>

    <header class="fade-in">
        
        <!-- Top navigation bar -->
        <div class="top-bar">
            <!-- App branding-->
            <div class="logo-area">
                <h2>🌱 MindCare</h2>
                <p>small emotional check-ins</p>
            </div>

            <!-- Theme toggle button -->
            <button id="theme-toggle">🌙</button>

        </div>

        <h1>How are you feeling today?</h1>
        <p>Take a moment to check in with yourself.</p>
    </header>

    <main>

        <div class="progress-indicator">
            <span class="progress-dot active-dot"></span>
            <span class="progress-dot"></span>
            <span class="progress-dot"></span>
        </div>

        <div class="top-layout">
            
            <!-- MOOD SECTION -->
            <section class="mood-section">
                <h2>Choose your mood</h2>

                <button onclick="setMood('happy', event)">🙂 Happy</button>
                <button onclick="setMood('neutral', event)">😐 Okay</button>
                <button onclick="setMood('sad', event)">😔 Sad</button>
                <button onclick="setMood('stress', event)">😰 Stressed</button>
                <button onclick="setMood('tired', event)">😴 Tired</button>
            </section>

            <!-- NEED SECTION -->
            <section class="need-section">
                <h2>What do you need today?</h2>

                <button onclick="setNeed('calm', event)">🧘 Calm</button>
                <button onclick="setNeed('talk', event)">💬 Talk</button>
                <button onclick="setNeed('rest', event)">😴 Rest</button>
                <button onclick="setNeed('focus', event)">🎯 Focus</button>
                <button onclick="setNeed('distraction', event)">🎧 Distraction</button>

                <!-- Step navigation buttons -->
                <div class="step-buttons">
                    <button class="secondary-btn" onclick="goBackToMood()">⬅ Back</button>
                </div>
            </section>
        </div>

         <!-- RESULT SECTION -->
          <section class="result-section">
            <h2>Your Result</h2>
            <p id="result-text" class="fade-in">Click below to reveal your personalized result.</p>

            <button id="show-result-btn" class="primary-btn" onclick="showResult()">Show Result</button>

            <!-- Step navigation buttons -->
            <div class="step-buttons" id="result-nav">
                <button id="result-back-btn" class="secondary-btn" onclick="goBackToNeed()">⬅ Back</button>
                <button id="restart-btn" class="secondary-btn" onclick="restartCheckIn()">↺ Check In Again</button>
            </div>
          </section>

          <!-- HISTORY SECTION -->
            <section class="history-section">
                <h2>Recent Check-ins</h2>

                <!-- Personalized insight generated from recent check-ins -->
                <p id="insight-text"></p>

                <ul id="history-list"></ul>
            </section>
    </main>

    <footer>
        <p>made with care by Ezgi</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
